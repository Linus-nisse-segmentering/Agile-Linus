services:
  app:
    image: ghcr.io/linus-nisse-segmentering/agile-linus:latest
    container_name: sinatra-app
    ports:
      - "1010:1010"
    environment:
      - RACK_ENV=production
      - DB_HOST=${DB_HOST:?DB_HOST is required}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-recipe_cookbook}
      - DB_USER=${DB_USER:-recipe_user}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_SSLMODE=${DB_SSLMODE:-prefer}
      - DB_INIT=true
    networks:
      - shared-monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ruby -e \"require 'net/http'; res = Net::HTTP.get_response(URI('http://127.0.0.1:1010/metrics')); exit(res.is_a?(Net::HTTPSuccess) ? 0 : 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  shared-monitoring:
    name: agile-linus-shared-monitoring
    external: true
